<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Meter</title>
  <link rel="stylesheet" href="meter.css">
  <script type="module" src="meter.js"></script>
</head>
<body>
  <!-- The window is wider than the pill so the hover card has room; the empty area lets clicks through. -->
  <div class="card" id="card" hidden></div>
  <!-- Drag anywhere on the pill to move it up or down; a click on a ring opens the dashboard. -->
  <nav class="pill" id="pill" aria-label="AI Meter">
    <button type="button" class="close" id="close" title="Hide meter (bring it back from the dashboard)" aria-label="Hide meter">&#215;</button>
    <div class="rings" id="rings"></div>
  </nav>
</body>
</html>
